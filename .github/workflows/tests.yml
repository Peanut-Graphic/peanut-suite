# Peanut Suite — Testing Protocol v2 nets (security + property) + CLASS-007 static gate.
#
# Honest scope: the WP-dependent contract suite (net 7) boots in its own workflow
# (wp-contract.yml) against a real WordPress + MySQL. The jobs here are the ones that
# run WITHOUT a WP boot, plus the blocking CLASS-007 static foot-gun gate:
#   - static-footguns (CLASS-007): semgrep over modules/ + core/ (BLOCKING)
#   - Net 2 (security): composer audit + npm audit — BLOCKING (ratcheted 2026-08-18)
#   - Net 6 (property): PHP pure-function property tests + JS fast-check property tests
#   - Regression guards (self-contained pure PHP)
name: tests

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-footguns:
    name: CLASS-007 Static Foot-gun Gate
    runs-on: ubuntu-latest   # pure static (semgrep only) — GitHub-hosted so the security gate never depends on the self-hosted pool

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install semgrep
        run: pip install semgrep

      - name: Semgrep CLASS-007 foot-gun gate (blocking)
        run: semgrep --config .peanut/static-rules/peanut-php-footguns.yml modules/ core/ --error

  php-security-and-property:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify declared PHP support
        run: php scripts/verify-php-runtime.php

      # Net 2 — dependency audit. Blocking: the tree is clean and stays clean.
      - name: Dependency audit (composer)
        run: composer audit

      # Net 6 — property tests over PURE functions (no WordPress).
      - name: Property tests
        run: vendor/bin/phpunit --testsuite=Property

      - name: Regression guards
        run: vendor/bin/phpunit --testsuite=Regression

  php-minimum-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup declared minimum PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer

      - name: Install dependencies from the lockfile
        run: composer install --no-interaction --prefer-dist

      - name: Verify declared PHP support
        run: php scripts/verify-php-runtime.php --expect-runtime=8.1

      - name: Property tests
        run: vendor/bin/phpunit --testsuite=Property

      - name: Regression guards
        run: vendor/bin/phpunit --testsuite=Regression

  js-security-and-property:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # Net 2 — dependency audit. Blocking at MODERATE; covers frontend/ only.
      # The separate functions-security job owns the Firebase functions lock.
      #
      # Not "high": npm grades plenty of real XSS/prototype-pollution findings
      # "moderate", including GHSA-55q2-fjhq-7xh7 (dompurify), which a high
      # gate lets through with exit 0 — verified by execution against the
      # vulnerable pin. The tree is clean at moderate today, so this holds the
      # line rather than merely looking like it does.
      - name: Dependency audit (npm)
        run: npm audit --audit-level=moderate

      # Net 6 — fast-check property tests (+ the rest of the vitest suite).
      - name: Vitest (property + unit + a11y)
        run: npx vitest run

  functions-security:
    name: Firebase functions dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test dependency audit exception contract
        run: npm run test:audit-contract

      - name: Audit production dependencies at the fleet moderate floor
        run: |
          set +e
          npm audit --omit=dev --audit-level=moderate --json > "$RUNNER_TEMP/functions-npm-audit.json"
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            echo "::error::npm audit failed to produce a vulnerability result (exit $audit_status)"
            exit "$audit_status"
          fi
          node scripts/verify-dependency-audit.mjs \
            "$RUNNER_TEMP/functions-npm-audit.json" \
            ../.github/dependency-audit-exceptions.json \
            ../.peanut/platform.yml

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # nothing published. It proves the artifact the publisher WOULD build is
      # coherent -- version constants that agree with the header, every INCLUDE
      # path present, vendor/ shipped where the build needs it, a changelog
      # entry for this version, and a stable-tag line the publisher's bump can
      # actually match.
      #
      # The checker is synced here from peanut-meta by configs-sync, so this job
      # needs no credential to reach that private repo. Drift is reported by
      # configs-sync and surfaced in the weekly audit. PAR-406.
      - name: Could this be released at all?
        run: bash .peanut/release/verify-release-readiness.sh peanut-suite
