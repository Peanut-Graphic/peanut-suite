name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-footguns:
    name: CLASS-007 Static Foot-gun Gate
    runs-on: [self-hosted, linux, peanut-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install semgrep
        run: pip install semgrep

      - name: Semgrep CLASS-007 foot-gun gate (blocking)
        run: semgrep --config .peanut/static-rules/peanut-php-footguns.yml modules/ core/ --error
