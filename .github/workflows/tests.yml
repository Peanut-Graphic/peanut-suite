# Tests gate — Wave 4 of the ecosystem testing scrub.
# PEANUT-SUITE's accessibility.yml only ran the a11y subset. This runs the FULL
# frontend vitest suite on every push/PR so all tests gate, not just a11y.
name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
