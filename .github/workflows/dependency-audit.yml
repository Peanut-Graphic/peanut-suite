name: dependency audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked auditor
        run: |
          python -m venv "$RUNNER_TEMP/dependency-audit-venv"
          "$RUNNER_TEMP/dependency-audit-venv/bin/python" -m pip install \
            --require-hashes \
            --no-deps \
            -r requirements-dependency-audit.lock

      - name: Audit the locked auditor
        run: |
          "$RUNNER_TEMP/dependency-audit-venv/bin/pip-audit" \
            -r requirements-dependency-audit.lock \
            --no-deps \
            --disable-pip

      - name: Audit the locked platform validator
        run: |
          "$RUNNER_TEMP/dependency-audit-venv/bin/pip-audit" \
            -r .peanut/platform/requirements.lock \
            --no-deps \
            --disable-pip
